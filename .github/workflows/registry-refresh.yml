name: registry-refresh (weekly)

# Moves devkit tool pins forward to upstream: GitHub-source tools get the
# default-branch HEAD SHA, PyPI-source tools get the newest released
# version. When anything moves, registry version + generated are bumped and
# committed on a chore/registry-refresh-* branch that lands on main via pull
# request (main is protected — direct pushes fail with GH006); the
# manifest-sync workflow in devin-devkit re-exports the public manifest on
# the next day, so 'devin-devkit update' always sees a fresh registry.

on:
  schedule:
    - cron: "33 7 * * 1"   # Mondays 07:33 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push chore/registry-refresh-* branches
      pull-requests: write   # open the refresh PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Refresh devkit pins from GitHub and PyPI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/refresh_devkit_refs.py

      - name: Validate refreshed registry
        run: python3 tools/validate_registry.py

      - name: Commit refreshed registry
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet registry.json; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/registry-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git add registry.json
          git commit -m "chore: refresh devkit tool pins"
          git push -u origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
          HEAD_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PR_BOT_TOKEN secret is required: PRs created with GITHUB_TOKEN never trigger CI, review or auto-approve workflows (GitHub anti-recursion). The PR would sit unmergeable, so refusing to open it." >&2
            exit 1
          fi
          existing=$(gh pr list -R "$GITHUB_REPOSITORY" \
            --head "$HEAD_BRANCH" --base main --state open --limit 1 \
            --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "PR already exists for $HEAD_BRANCH -> main: $existing"
            exit 0
          fi
          body=$(printf 'Auto-generated by the registry-refresh (weekly) workflow.\n\nDevkit tool pins moved to upstream (GitHub default-branch HEAD SHAs / newest PyPI releases); registry version and generated stamp bumped.\n\nRun: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh pr create -R "$GITHUB_REPOSITORY" \
            --head "$HEAD_BRANCH" --base main \
            --title "chore: registry refresh $(date +%F)" \
            --body "$body"
