name: contract-check (weekly)

# A5: exercises devin-internals-spec's `contract check` weekly — the guard
# that must fail loudly the day Devin ships a store version the ecosystem
# does not know. Runs against synthetic fixtures only; no real stores.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install devin-internals-spec from git
        run: |
          pip install \
            "git+https://github.com/Icaro0310/devin-internals-spec@main"

      - name: Known-schema fixture passes the contract
        run: |
          devin-inspect make-fixture /tmp/fx
          devin-inspect contract /tmp/fx

      - name: Future-schema fixture fails loudly
        run: |
          devin-inspect make-fixture --schema-version 99 /tmp/future
          if devin-inspect contract /tmp/future; then
            echo "::error::contract accepted an unknown schema — drift guard broken"
            exit 1
          fi
          echo "contract check correctly rejected the future-schema fixture"
