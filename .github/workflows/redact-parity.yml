name: redact-parity

# G1(c) gate for the vendored TS port of devin-redact:
#   - `parity` (PR gate): golden corpus replayed through pinned
#     devin-redact AND the TS port — bidirectional (a TS-only pattern
#     fails just like a Python-only one).
#   - `drift` (weekly, Sun 06:17 UTC): same check against the LATEST
#     published devin-redact. The ≤7-day window is an explicitly accepted
#     risk (docs/discovery/g1-decision-record.md §c, condition 2); tighten
#     to release-webhook if a real incident ever lands in it.

on:
  pull_request:
    paths:
      - packages/agent-sessions/src/redact.ts
      - packages/agent-sessions/tools/redact_parity_runner.mjs
      - packages/agent-sessions/test/redact-corpus.jsonl
      - packages/agent-sessions/test/redact.test.ts
      - tools/redact_corpus.py
      - tools/check_redact_parity.py
      - tools/requirements-redact.txt
      - .github/workflows/redact-parity.yml
  schedule:
    - cron: "17 6 * * 0"   # Sundays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e2fc11cbdc8616 # v6
        with:
          python-version: "3.12"
      - name: Install pinned devin-redact
        run: pip install -r tools/requirements-redact.txt
      - name: Bidirectional parity vs pinned release
        run: python3 tools/check_redact_parity.py --golden

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e2fc11cbdc8616 # v6
        with:
          python-version: "3.12"
      - name: Install latest devin-redact
        run: pip install -U devin-redact
      - name: Bidirectional parity vs latest release
        run: python3 tools/check_redact_parity.py --drift
