name: baseline-snapshot (weekly)

# P5 baseline collection: commits a dated snapshot to snapshots/ every
# Monday and opens an issue if collection fails — a missed snapshot cannot
# be recovered retroactively. Window: 2026-10-08 → 2026-12-03.

on:
  schedule:
    - cron: "15 8 * * 1"     # Mondays 08:15 UTC
    - cron: "15 8 3 12 *"    # Dec 3: final snapshot on the audit day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Baseline window guard
        id: window
        run: |
          # The Dec 3 cron repeats annually; make scheduled runs a no-op
          # once the P5 window has ended. Manual dispatch always runs.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%F)" \> "2026-12-03" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect baseline + fork visibility
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/snapshot_baseline.py --json "snapshots/$(date +%F).json"
          python3 tools/fork_visibility.py --json "snapshots/forks-$(date +%F).json"

      - name: Commit snapshots
        id: commit
        if: steps.window.outputs.active == 'true'
        run: |
          if git diff --quiet snapshots/ 2>/dev/null && [ -z "$(git status --porcelain snapshots/)" ]; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "snapshots/$(date +%F).json" "snapshots/forks-$(date +%F).json"
          git commit -m "chore: weekly baseline snapshot $(date +%F)"
          branch="chore/baseline-snapshot-$(date +%F)-${{ github.run_attempt }}"
          git push origin "HEAD:$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
        run: |
          # GITHUB_TOKEN-created PRs never trigger CI (anti-recursion),
          # so the review pipeline needs the bot PAT, same as open-pr-bot.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PR_BOT_TOKEN is not configured — cannot open snapshot PR"
            exit 1
          fi
          branch="${{ steps.commit.outputs.branch }}"
          gh pr create \
            --title "chore: baseline snapshot $(date +%F)" \
            --body "Auto-generated by the weekly baseline-snapshot workflow (run ${{ github.run_id }}). Snapshots under snapshots/ for $(date +%F). Merging keeps the P5 audit trail on protected main." \
            --head "$branch" \
            --base main

      - name: Fail if collectors recorded errors
        if: steps.window.outputs.active == 'true'
        run: |
          # Partial data is committed above; a non-empty errors array means the
          # snapshot is incomplete, so fail the run to trigger the issue below.
          n=$(python3 -c "import json;print(len(json.load(open('snapshots/$(date +%F).json')).get('errors') or []))")
          m=$(python3 -c "import json;print(len(json.load(open('snapshots/forks-$(date +%F).json')).get('errors') or []))")
          if [ "$n" -gt 0 ] || [ "$m" -gt 0 ]; then
            echo "snapshot has $n baseline + $m fork-visibility collection error(s)"
            exit 1
          fi

      - name: Open issue on collection failure
        if: failure() && steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "baseline snapshot failed $(date +%F)" \
            --body "Weekly P5 collection failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} — rerun \`baseline-snapshot\` via workflow_dispatch; the missed window cannot be recovered later."
