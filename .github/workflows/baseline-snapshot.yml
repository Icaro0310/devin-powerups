name: baseline-snapshot (weekly)

# P5 baseline collection: commits a dated snapshot to snapshots/ on the
# append-only `snapshots` data branch every Monday (main is protected —
# pushes must go through PRs) and opens an issue if collection fails —
# a missed snapshot cannot be recovered retroactively.
# Window: 2026-10-08 → 2026-12-03.

on:
  schedule:
    - cron: "15 8 * * 1"     # Mondays 08:15 UTC
    - cron: "15 8 3 12 *"    # Dec 3: final snapshot on the audit day
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Baseline window guard
        id: window
        run: |
          # The Dec 3 cron repeats annually; make scheduled runs a no-op
          # once the P5 window has ended. Manual dispatch always runs.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%F)" \> "2026-12-03" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore snapshot series from the data branch
        if: steps.window.outputs.active == 'true'
        run: |
          # previous_snapshot() diffs against the newest dated JSON in
          # snapshots/, which lives on the data branch — main only keeps
          # the day-1 files. Materialize the series first so the recorded
          # structural diff is week-over-week, not day-1-over-week. A
          # confirmed-absent branch means first run; an unreachable origin
          # must stop the run or a stale day-1 diff gets published.
          if git ls-remote --exit-code --heads origin snapshots >/dev/null 2>&1; then
            git fetch -q origin "+refs/heads/snapshots:refs/remotes/origin/snapshots"
            for f in $(git ls-tree --name-only origin/snapshots snapshots/); do
              git show "origin/snapshots:$f" > "$f"
            done
          else
            rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "no snapshots branch yet — first run: day-1 is the only baseline"
            else
              echo "cannot reach origin for the snapshots branch (rc=$rc) — failing so a stale day-1 diff is not published"
              exit 1
            fi
          fi

      - name: Collect baseline + fork visibility
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/snapshot_baseline.py --json "snapshots/$(date +%F).json"
          python3 tools/fork_visibility.py --json "snapshots/forks-$(date +%F).json"

      - name: Commit snapshots
        if: steps.window.outputs.active == 'true'
        run: |
          if git diff --quiet snapshots/ 2>/dev/null && [ -z "$(git status --porcelain snapshots/)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Snapshots commit to the append-only `snapshots` data branch —
          # main is protected (PR-only) so a direct push fails GH006. The
          # restore step already fetched the branch ref (a transient extra
          # fetch just leaves the ref as-is); fresh JSONs are parked in
          # tmp so -fB may safely clobber untracked collisions — on a
          # same-day rerun today's collection wins over the earlier
          # commit instead of being silently discarded.
          tmpdir="$(mktemp -d)"
          cp "snapshots/$(date +%F).json" "snapshots/forks-$(date +%F).json" "$tmpdir/"
          git fetch -q origin "+refs/heads/snapshots:refs/remotes/origin/snapshots" 2>/dev/null || true
          if git rev-parse --verify --quiet origin/snapshots >/dev/null; then
            git checkout -fB snapshots origin/snapshots
          else
            git checkout -b snapshots
          fi
          cp "$tmpdir/$(date +%F).json" "$tmpdir/forks-$(date +%F).json" snapshots/
          git add "snapshots/$(date +%F).json" "snapshots/forks-$(date +%F).json"
          if git diff --cached --quiet; then
            echo "snapshots branch already has today's data"
            exit 0
          fi
          git commit -m "chore: weekly baseline snapshot $(date +%F)"
          git push -u origin snapshots

      - name: Fail if collectors recorded errors
        if: steps.window.outputs.active == 'true'
        run: |
          # Partial data is committed above; a non-empty errors array means the
          # snapshot is incomplete, so fail the run to trigger the issue below.
          n=$(python3 -c "import json;print(len(json.load(open('snapshots/$(date +%F).json')).get('errors') or []))")
          m=$(python3 -c "import json;print(len(json.load(open('snapshots/forks-$(date +%F).json')).get('errors') or []))")
          if [ "$n" -gt 0 ] || [ "$m" -gt 0 ]; then
            echo "snapshot has $n baseline + $m fork-visibility collection error(s)"
            exit 1
          fi

      - name: Open issue on collection failure
        if: failure() && steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "baseline snapshot failed $(date +%F)" \
            --body "Weekly P5 collection failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} — rerun \`baseline-snapshot\` via workflow_dispatch; the missed window cannot be recovered later."
