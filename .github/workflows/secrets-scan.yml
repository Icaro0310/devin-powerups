name: secrets-scan (reusable)

# Reusable only: repo ci.yml callers invoke this with `uses:` (see
# .github/workflows/VARIANTS.md). Purely declarative scan, no inputs.
# Known-fake fixtures are allowlisted per file via a repo-root
# `.secrets-scan-allow` (one `path sha256=<hex>` line each) — no blanket
# directory exclusions, and a hash pin means editing an allowlisted
# fixture re-triggers the scan instead of slipping past it.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan for secret-looking strings
        run: |
          set -e
          PATTERNS='(ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|api[_-]?key["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9_-]{16,})'
          # Fixture hygiene: no blanket --exclude-dir=fixtures — a real
          # secret committed under any dir named `fixtures` would pass
          # silently. Known fake fixtures are allowlisted via
          # .secrets-scan-allow entries of the form `path sha256=<hex>`;
          # the hash pin means editing an allowlisted fixture (e.g.
          # adding a real credential) re-triggers the scan. Binary files
          # are skipped: -I in `grep -rInE` ignores files grep considers
          # binary (NUL bytes), so SQLite fixtures can't smuggle a secret
          # past the scan.
          HITS=$(grep -rInE "$PATTERNS" --exclude-dir=.git --exclude-dir=node_modules . || true)
          if [ -f .secrets-scan-allow ] && [ -n "$HITS" ]; then
            FILTERED=""
            while IFS= read -r hit; do
              file="${hit%%:*}"
              file="${file#./}"
              allowed=0
              while IFS= read -r pat || [ -n "$pat" ]; do
                case "$pat" in ''|\#*) continue;; esac
                entry_path="${pat%% *}"
                entry_hash="${pat#*sha256=}"
                if [ "$file" = "$entry_path" ]; then
                  [ "$pat" = "$entry_hash" ] && break  # no hash pin: entry malformed, do not allow
                  [ "$(sha256sum "$file" | cut -d' ' -f1)" = "$entry_hash" ] && allowed=1
                  break
                fi
              done < .secrets-scan-allow
              [ "$allowed" -eq 0 ] && FILTERED="$FILTERED$hit"$'\n'
            done < <(printf '%s\n' "$HITS")
            HITS="$FILTERED"
          fi
          if [ -n "$HITS" ]; then
            printf '%s\n' "$HITS"
            echo "::error::Secret-looking content found. Sanitize or pin it in .secrets-scan-allow as 'path sha256=<hash>'."
            exit 1
          fi
          echo "No secret-looking content found."

      # Publish-auth meta-check (D-2026-10-11b): token-auth drift is born
      # when a publish workflow is created or edited, so the check rides
      # the required scan — it fires on every push/PR in every repo that
      # calls this reusable, while the author still has context. Banned
      # shapes: a live `secrets.PYPI_API_TOKEN` reference (token auth is
      # removed ecosystem-wide; comments explaining its absence are fine)
      # and `uses:`-calls to the reusable pypi-publish.yml, which can
      # never authenticate (PyPI binds job_workflow_ref to the reusable's
      # repository — an external caller cannot satisfy a per-repo TP).
      # Third banned shape (wheel-gate coverage): a publish workflow that
      # does not invoke the reusable verify-wheel-version — partial
      # coverage is otherwise the steady state, since nothing stops a new
      # package's publish workflow from omitting the call.
      - name: Assert publish workflows are OIDC-only
        run: |
          set -e
          bad=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if grep -vE '^[[:space:]]*#' "$f" | grep -nE 'secrets\.PYPI_API_TOKEN'; then
              echo "::error file=$f::token-based PyPI auth is banned — publish workflows are OIDC-only (id-token: write + Trusted Publisher)."
              bad=1
            fi
            if grep -vE '^[[:space:]]*#' "$f" | grep -nE 'uses:.*workflows/pypi-publish\.ya?ml'; then
              echo "::error file=$f::uses:-call to the reusable pypi-publish can never authenticate (job_workflow_ref binds to the reusable repo) — copy the inline template instead."
              bad=1
            fi
          done
          for f in .github/workflows/*pypi-publish*.yml .github/workflows/*pypi-publish*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -vE '^[[:space:]]*#' "$f" | grep -qE 'uses:.*verify-wheel-version\.ya?ml'; then
              echo "::error file=$f::publish workflow must invoke the reusable verify-wheel-version gate — wheel version drift is a real incident class (see BACKLOG wheel-gate meta-check)."
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "publish workflows are OIDC-only." || exit 1
