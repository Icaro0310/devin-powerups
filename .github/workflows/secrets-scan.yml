name: secrets-scan (reusable)

# Reusable only: repo ci.yml callers invoke this with `uses:` (see
# .github/workflows/VARIANTS.md). Purely declarative scan, no inputs.
# Repos with legitimate fixture exclusions keep an inline job instead
# (documented as a variant).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan for secret-looking strings
        run: |
          set -e
          PATTERNS='(ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|api[_-]?key["'"'"']?\s*[:=]\s*["'"'"'][A-Za-z0-9_-]{16,})'
          if grep -rInE "$PATTERNS" --exclude-dir=.git --exclude-dir=fixtures --exclude-dir=node_modules .; then
            echo "::error::Secret-looking content found. Sanitize before merging."
            exit 1
          fi
          echo "No secret-looking content found."
