name: reusable-pypi-publish

# Reusable workflow: verify a package's wheel __version__ and publish
# the SAME verified artifacts to PyPI.
#
# The `verify` job calls verify-wheel-version.yml, which builds dist/,
# asserts the wheel's __version__ matches pyproject, and uploads the
# verified dist/ as the `dist` artifact. `publish` downloads exactly
# that artifact — there is no unverified second build, and no caller
# can ship to PyPI without the gate passing.
#
# `uses: $/…` is the self-repository reference: it resolves to this
# repository at the exact ref the caller pinned, so the gate and the
# publisher can never drift to different commits.
#
# Auth is Trusted Publishing (OIDC) only — there is no API-token mode.
# A `password:` input is deliberately absent: an account-scoped PyPI
# token can upload to ANY project on the account, so keeping one as a
# "fallback" is pure attack surface. If OIDC fails, fix the publisher
# configuration; do not reintroduce a token.
#
# Configure TP BEFORE the first publish: create the Active Publisher on
# PyPI for <repo> + this workflow filename + environment "pypi" (or a
# pending publisher only when the project does not exist yet). A pending
# publisher is consumed by the first successful upload; if a token (or a
# differently-configured publisher) creates the project first, the
# pending entry goes stale and later OIDC runs fail with
# `invalid-pending-publisher`. Recovery: delete the stale pending entry
# and add an ACTIVE publisher on the project's own Publishing settings —
# a new pending publisher does not work once the project exists.
#
# PyPI validates the OIDC token's job_workflow_ref against the
# publisher's configured repo/workflow, which must live in the TP
# repository itself. A caller that `uses:` this central file gets
# job_workflow_ref=<this repo>/pypi-publish.yml and is rejected — so
# `uses:` callers can no longer publish through this file AT ALL (the
# removed token input was the only auth path they could satisfy; that is
# intentional). Each product repo carries its own inline copy of this
# file (the ecosystem pattern: one pypi-publish.yml per product repo).
#
# `module` only needs passing when the wheel's top_level.txt and
# project.name ('-' → '_') both miss the importable module name.

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory containing pyproject.toml
        required: false
        type: string
        default: "."
      python-version:
        description: Python version used to build
        required: false
        type: string
        default: "3.12"
      module:
        description: >-
          Importable module name that must expose __version__. Optional —
          derived from the built wheel when empty.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    uses: $/.github/workflows/verify-wheel-version.yml
    with:
      package-dir: ${{ inputs.package-dir }}
      module: ${{ inputs.module }}
      python-version: ${{ inputs.python-version }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
