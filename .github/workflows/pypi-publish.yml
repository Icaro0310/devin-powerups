name: reusable-pypi-publish

# Reusable workflow: verify a package's wheel __version__ and publish
# the SAME verified artifacts to PyPI.
#
# The `verify` job calls verify-wheel-version.yml, which builds dist/,
# asserts the wheel's __version__ matches pyproject, and uploads the
# verified dist/ as the `dist` artifact. `publish` downloads exactly
# that artifact — there is no unverified second build, and no caller
# can ship to PyPI without the gate passing.
#
# `uses: $/…` is the self-repository reference: it resolves to this
# repository at the exact ref the caller pinned, so the gate and the
# publisher can never drift to different commits.
#
# Two auth modes:
#   - Trusted Publishing (recommended, zero secrets): configure a
#     (pending) publisher on PyPI for the caller repo + workflow name +
#     environment "pypi"; the OIDC token minted by id-token:write does
#     the upload. Leave PYPI_API_TOKEN unset.
#   - API token: set repo secret PYPI_API_TOKEN; passed as the action's
#     password instead of OIDC.
#
# Usage from a caller repo:
#
#   jobs:
#     publish:
#       uses: Icaro0310/devin-powerups/.github/workflows/pypi-publish.yml@6016b68ae41c4012bce2bfdfaaa57b51949d9f1d # main
#
# Trusted Publishing caveat: PyPI validates the OIDC token's
# job_workflow_ref against the publisher's configured repo/workflow,
# which must live in the TP repository itself. A caller that `uses:`
# this central file gets job_workflow_ref=<this repo>/pypi-publish.yml,
# so TP rejects it — `uses:` works for API-token mode only. For TP, the
# caller carries its own copy of this file (the ecosystem pattern: one
# inline pypi-publish.yml per product repo).
#
# `module` only needs passing when the wheel's top_level.txt and
# project.name ('-' → '_') both miss the importable module name.

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory containing pyproject.toml
        required: false
        type: string
        default: "."
      python-version:
        description: Python version used to build
        required: false
        type: string
        default: "3.12"
      module:
        description: >-
          Importable module name that must expose __version__. Optional —
          derived from the built wheel when empty.
        required: false
        type: string
        default: ""
    secrets:
      PYPI_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    uses: $/.github/workflows/verify-wheel-version.yml
    with:
      package-dir: ${{ inputs.package-dir }}
      module: ${{ inputs.module }}
      python-version: ${{ inputs.python-version }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # empty = OIDC trusted publishing; set PYPI_API_TOKEN to use a token
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
