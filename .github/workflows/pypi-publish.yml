name: reusable-pypi-publish

# Reusable workflow: build a Python package and publish it to PyPI.
#
# Two auth modes:
#   - Trusted Publishing (recommended, zero secrets): configure a
#     (pending) publisher on PyPI for the caller repo + workflow name +
#     environment "pypi"; the OIDC token minted by id-token:write does
#     the upload. Leave PYPI_API_TOKEN unset.
#   - API token: set repo secret PYPI_API_TOKEN; passed as the action's
#     password instead of OIDC.
#
# Usage from a caller repo:
#
#   jobs:
#     publish:
#       uses: Icaro0310/devin-powerups/.github/workflows/pypi-publish.yml@main

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory containing pyproject.toml
        required: false
        type: string
        default: "."
      python-version:
        description: Python version used to build
        required: false
        type: string
        default: "3.12"
    secrets:
      PYPI_API_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Build sdist and wheel
        working-directory: ${{ inputs.package-dir }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ inputs.package-dir }}/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # empty = OIDC trusted publishing; set PYPI_API_TOKEN to use a token
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
