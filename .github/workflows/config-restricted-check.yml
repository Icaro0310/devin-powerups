name: config-restricted-check (reusable)

# Reusable only: repo ci.yml callers invoke this with `uses:` (see
# .github/workflows/VARIANTS.md). Covers the Restricted-Mode failure
# class the other sensors do not:
#   * a VS Code extension manifest without
#     capabilities.untrustedWorkspaces is silently inert in Restricted
#     Mode — the exact mode corporate environments force;
#   * a `supported: "limited"` extension that reads workspace settings
#     outside restrictedConfigurations re-opens the
#     execFile(configuration.get("executable")) vector — restricted-
#     by-default: every contributed or source-read config key must be
#     listed, so a new .get() fails the gate instead of slipping past
#     key-by-key review.
#
# The scanner ships in this repo (scripts/check_config_restricted.py)
# and is fetched from the same `v1` tag the caller pinned — script and
# workflow versions move together on retag (D-2026-10-13i). A repo that
# carries its own copy of the script (this one, on a PR that edits it)
# runs that copy instead, so scanner changes are exercised by the PR
# that introduces them.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  config-restricted-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch the scanner when the repo does not ship it
        if: hashFiles('scripts/check_config_restricted.py') == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Icaro0310/devin-powerups
          ref: v1
          path: .powerups-sensor
          persist-credentials: false

      - name: Check untrustedWorkspaces coverage
        run: |
          set -e
          SCRIPT=scripts/check_config_restricted.py
          [ -f "$SCRIPT" ] || SCRIPT=".powerups-sensor/$SCRIPT"
          python3 "$SCRIPT" --root .
          python3 "$SCRIPT" --selftest
