name: weekly-repo-report

# Weekly activity report for the public devin-* project repos listed in
# registry.json (kind=project, visibility=public). Generates a standalone
# HTML report and uploads it as an artifact on every run — including runs
# where every repo fetch fails, in which case the generate step exits
# non-zero and the run stays visibly red after artifact/email handling.
#
# Email is optional. Configure the four MailerSend SMTP secrets plus the
# REPORT_RECIPIENT and REPORT_SENDER repository variables in Settings → Secrets
# and variables → Actions. The sender must be verified with your mail provider.
# If configuration is incomplete, the HTML artifact is still uploaded and the
# email step is skipped.
#
# Only registry entries tagged kind=project and visibility=public are queried.

on:
  schedule:
    - cron: "0 7 * * 0" # Sundays at 07:00 UTC = 04:00 AM Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run report tests
        run: python tools/test_weekly_repo_report.py

      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/weekly_repo_report.py --out report/weekly-repo-report.html

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-repo-report
          path: report/weekly-repo-report.html
          retention-days: 90

      - name: Check email configuration
        if: always()
        id: mail
        env:
          MH: ${{ secrets.MAILERSEND_SMTP_HOST }}
          MP: ${{ secrets.MAILERSEND_SMTP_PORT }}
          MU: ${{ secrets.MAILERSEND_SMTP_USER }}
          MW: ${{ secrets.MAILERSEND_SMTP_PASSWORD }}
          RECIPIENT: ${{ vars.REPORT_RECIPIENT }}
          SENDER: ${{ vars.REPORT_SENDER }}
        run: |
          if [ -n "$MH" ] && [ -n "$MP" ] && [ -n "$MU" ] && [ -n "$MW" ] && [ -n "$RECIPIENT" ] && [ -n "$SENDER" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Configure SMTP secrets and REPORT_RECIPIENT/REPORT_SENDER variables to enable email. The HTML artifact was still uploaded."
          fi

      - name: Send report email
        if: always() && steps.mail.outputs.present == 'true'
        env:
          MAILERSEND_SMTP_HOST: ${{ secrets.MAILERSEND_SMTP_HOST }}
          MAILERSEND_SMTP_PORT: ${{ secrets.MAILERSEND_SMTP_PORT }}
          MAILERSEND_SMTP_USER: ${{ secrets.MAILERSEND_SMTP_USER }}
          MAILERSEND_SMTP_PASSWORD: ${{ secrets.MAILERSEND_SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ vars.REPORT_RECIPIENT }}
          REPORT_SENDER: ${{ vars.REPORT_SENDER }}
        run: >
          python tools/weekly_repo_report.py
          --send report/weekly-repo-report.html
          --to "$REPORT_RECIPIENT"
          --from "$REPORT_SENDER"
