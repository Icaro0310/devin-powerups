name: release-fanout (reusable)

# One-call release fan-out: build+verify the wheel, publish to PyPI via
# OIDC, build+sign the GHCR image, package the VS Code extension, and
# emit the marketplace notes — the legs every product repo wires by
# hand today. Caller template and input docs: VARIANTS.md.
#
# PyPI leg — READ BEFORE CALLING FROM ANOTHER REPO:
# PyPI validates the OIDC token's job_workflow_ref against the Trusted
# Publisher's repo+workflow. For a cross-repo `uses:` caller that ref
# is THIS file (Icaro0310/devin-powerups/.../release.yml), which a
# per-repo TP can never match — reusable-workflow publishing is still
# unsupported PyPI-side (pypi/warehouse#11096; ecosystem finding
# D-2026-10-11b in BACKLOG.md). The publish-pypi job therefore guards
# the upload: when job_workflow_ref's repo differs from the calling
# repo it emits a warning and skips, and the repo's own
# pypi-publish.yml remains the PyPI path. The upload runs only when
# caller and TP are colocated — a same-repo caller, or a repo that
# vendors this file under its own name. The version-exists check runs
# unconditionally either way, so re-releases stay idempotent.
#
# `uses: $/…` below is the self-repository reference: it resolves to
# this repository at the exact ref the caller pinned, so the wheel gate
# can never drift to a different commit than the fan-out invoking it.
#
# The caller's `uses:` job MUST grant every scope any job here
# requests — `contents: read`, `id-token: write` (PyPI OIDC + cosign
# keyless) and `packages: write` (GHCR) — missing grants fail at
# startup (startup_failure with zero jobs).

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory containing pyproject.toml
        type: string
        required: true
      module:
        description: >-
          Importable module name that must expose __version__ — passed
          through to the wheel gate; derived from the built wheel when
          empty.
        type: string
        required: false
        default: ""
      pypi-environment:
        description: >-
          GitHub environment gating the PyPI job — must match the
          environment configured on the project's Trusted Publisher
          (pypi / pypi-devkit / pypi-skill-catalog / pypi-switch).
          Unused when package-dir has no pyproject.toml (the wheel legs
          skip by artifact detection).
        type: string
        required: false
        default: ""
      python-version:
        description: Interpreter used to build and verify the wheel
        type: string
        default: "3.12"
      vscode-ext-dir:
        description: >-
          Directory of the VS Code extension to package. When set, the
          manifest lint + `vsce package` run and the .vsix uploads as
          the `vsix` artifact for the manual portal publish; when empty
          the leg is skipped.
        type: string
        required: false
        default: ""
      docker-image:
        description: >-
          GHCR image name (e.g. devin-memory →
          ghcr.io/<owner>/devin-memory), built from the repo-root
          Dockerfile and cosign-signed; when empty the leg is skipped.
        type: string
        required: false
        default: ""
      azure-marketplace-required:
        description: >-
          When true, a non-successful marketplace leg (missing Entra
          vars, failed federated login, failed vsce publish) fails the
          vscode-ext job AFTER Open VSX ran — for repos past the
          Entra credential provisioning window. Declared per-caller so
          the intent lives in versioned code, not repo settings; a new
          caller defaults to false until it opts in.
        type: boolean
        required: false
        default: false
    secrets:
      OVSX_PAT:
        description: >-
          Open VSX access token — when the caller forwards it
          (`secrets: OVSX_PAT` or `secrets: inherit`), the packaged
          vsix publishes to open-vsx.org after the Marketplace leg;
          absent, the step skips with a warning. The `icaro0310`
          namespace has contributor rights, so publishing works before
          the owner grant in EclipseFdn/open-vsx.org#14088 — that grant
          only removes the "not a verified publisher" banner.
        required: false
    outputs:
      version:
        description: Version resolved from the package's pyproject.toml
        value: ${{ jobs.publish-pypi.outputs.version }}
      extension-version:
        description: Version from the VS Code extension manifest, when vscode-ext-dir is set
        value: ${{ jobs.detect.outputs.ext-version }}

permissions:
  contents: read

jobs:
  # Artifact detection: a package without pyproject.toml is an
  # extension-only release — the verify/pypi legs skip with a warning
  # instead of failing the reusable contract. docker/vscode-ext keep
  # running (they only need the wheel gate WHEN a wheel exists).
  detect:
    runs-on: ubuntu-latest
    outputs:
      has-wheel: ${{ steps.d.outputs.has-wheel }}
      ext-version: ${{ steps.d.outputs.ext-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # When the wheel legs skip, detect becomes the publish-origin
      # gate — the same ancestry check verify-wheel-version runs.
      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac

      - id: d
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
          VSCODE_EXT_DIR: ${{ inputs.vscode-ext-dir }}
        run: |
          if [ -f "$PACKAGE_DIR/pyproject.toml" ]; then
            echo "has-wheel=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-wheel=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no pyproject.toml under $PACKAGE_DIR — wheel legs (verify, PyPI) skip; extension-only release"
          fi
          if [ -n "$VSCODE_EXT_DIR" ] && [ -f "$VSCODE_EXT_DIR/package.json" ]; then
            v=$(python3 -c "import json,os; print(json.load(open(os.path.join(os.environ['VSCODE_EXT_DIR'],'package.json')))['version'])")
            echo "ext-version=$v" >> "$GITHUB_OUTPUT"
          fi

      # Shared tag gate — checked ONCE upstream of every publish leg so a
      # mistagged release fails here instead of shipping a wrong artifact
      # on legs that run no tag check of their own (docker) or only
      # recognize one convention (the PyPI `-v` guard). Both conventions:
      # bare vX.Y.Z first (a SemVer prerelease may itself contain '-v',
      # e.g. v1.2.3-v2), then <pkg>-vX.Y.Z.
      - name: Check tag matches detected versions
        if: github.ref_type == 'tag'
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
          VSCODE_EXT_DIR: ${{ inputs.vscode-ext-dir }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, tomllib
          ref = os.environ['GITHUB_REF_NAME']
          if re.match(r'^v\d+\.\d+', ref):
              tag_version, tag_pkg = ref[1:], None
          elif '-v' in ref:
              tag_pkg, tag_version = ref.rsplit('-v', 1)
          else:
              print(f'::error::tag {ref} matches no release convention '
                    '(vX.Y.Z or <pkg>-vX.Y.Z)')
              sys.exit(1)
          errs = []
          pyproject = os.path.join(os.environ['PACKAGE_DIR'], 'pyproject.toml')
          if os.path.exists(pyproject):
              meta = tomllib.load(open(pyproject, 'rb'))['project']
              if meta['version'] != tag_version:
                  errs.append(f"pyproject version {meta['version']} != tag {ref}")
              allowed = {meta['name'], os.path.basename(
                  os.path.normpath(os.environ['PACKAGE_DIR']))}
              if tag_pkg is not None and tag_pkg not in allowed:
                  errs.append(f"tag prefix '{tag_pkg}' names neither {meta['name']} "
                              f"nor {os.path.basename(os.path.normpath(os.environ['PACKAGE_DIR']))}")
          ext_manifest = os.path.join(
              os.environ.get('VSCODE_EXT_DIR') or '.', 'package.json')
          if os.path.exists(ext_manifest):
              v = json.load(open(ext_manifest))['version']
              if v != tag_version:
                  errs.append(f"package.json version {v} != tag {ref}")
          for e in errs:
              print(f'::error::{e}')
          sys.exit(1 if errs else 0)
          PY

  verify:
    needs: detect
    if: needs.detect.outputs.has-wheel == 'true'
    permissions:
      contents: read
    uses: $/.github/workflows/verify-wheel-version.yml
    with:
      package-dir: ${{ inputs.package-dir }}
      module: ${{ inputs.module }}
      python-version: ${{ inputs.python-version }}

  publish-pypi:
    needs: [detect, verify]
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.has-wheel == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    # `|| 'pypi'` — an empty expansion is an invalid environment name
    # and fails workflow startup even though the `if` skips the job.
    environment: ${{ inputs.pypi-environment || 'pypi' }}
    permissions:
      contents: read    # checkout reads pyproject for name+version
      id-token: write   # PyPI Trusted Publishing (OIDC)
    outputs:
      version: ${{ steps.pypi.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      # Tag sanity + idempotency in one read. A `<pkg>-v<ver>` tag whose
      # version disagrees with pyproject is a mistagged release — fail
      # fast, the wheel gate cannot see the tag. Then the PyPI JSON API
      # is checked file-by-file: a version whose dist filenames are ALL
      # published sets exists=true and the upload below is skipped;
      # a PARTIAL release (e.g. sdist landed, wheel did not) keeps
      # exists=false so the upload resumes — skip-existing then makes
      # the already-there files a no-op. 404 = unpublished; other
      # non-2xx fails the step — a transient index error must not read
      # as "safe to skip".
      - name: Check tag and PyPI release state
        id: pypi
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib, urllib.error, urllib.request
          meta = tomllib.load(open(os.path.join(
              os.environ['PACKAGE_DIR'], 'pyproject.toml'), 'rb'))['project']
          name, version = meta['name'], meta['version']
          ref = os.environ['REF_NAME']
          if os.environ['REF_TYPE'] == 'tag':
              # Bare vX.Y.Z first — a SemVer prerelease may itself
              # contain '-v' (v1.2.3-v2) — then <pkg>-vX.Y.Z. Bare tags
              # carry no package prefix to validate, only the version.
              if re.match(r'^v\d+\.\d+', ref):
                  tag_pkg, tag_ver = None, ref[1:]
              elif '-v' in ref:
                  tag_pkg, tag_ver = ref.rsplit('-v', 1)
              else:
                  tag_pkg = tag_ver = None
              if tag_ver is not None:
                  # Tag prefix names the package: ecosystem tags use the
                  # pyproject name OR the package-dir basename
                  # (qa-pack-v0.1.0 vs devin-qa-pack-v0.1.0 — both seen).
                  allowed = {name, os.path.basename(
                      os.path.normpath(os.environ['PACKAGE_DIR']))}
                  if tag_ver != version or (tag_pkg is not None
                                            and tag_pkg not in allowed):
                      print(f'::error::tag {ref} does not name {name} '
                            f'{version} — a mistagged release would publish '
                            'the wrong package or version; retag or bump.')
                      raise SystemExit(1)
          published = set()
          try:
              data = json.load(urllib.request.urlopen(
                  f'https://pypi.org/pypi/{name}/{version}/json', timeout=30))
              published = {f['filename'] for f in data.get('urls', [])}
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
          local = {f.name for f in os.scandir('dist') if f.is_file()}
          missing = sorted(local - published)
          exists = bool(published) and not missing
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'version={version}\n')
              fh.write(f'exists={"true" if exists else "false"}\n')
          if exists:
              print(f'::notice::{name} {version} is already fully on PyPI — '
                    'the upload step is skipped (idempotent re-release).')
          elif missing:
              print(f'::notice::{name} {version} is partially published — '
                    f'uploading missing files: {missing}')
          PY

      # OIDC feasibility guard: PyPI binds the exchange to
      # job_workflow_ref — for a cross-repo `uses:` caller that is this
      # file in devin-powerups, which no per-repo Trusted Publisher can
      # match (pypi/warehouse#11096). Skip with a warning instead of a
      # red leg; the product repo's own pypi-publish.yml stays the PyPI
      # path. Same-repo callers and vendored copies publish normally.
      - name: Check OIDC publisher feasibility
        id: oidc
        env:
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
          REPO: ${{ github.repository }}
        run: |
          wf_repo="${JOB_WORKFLOW_REF%%/.github/*}"
          if [ "$wf_repo" = "$REPO" ]; then
            echo "feasible=true" >> "$GITHUB_OUTPUT"
          else
            echo "feasible=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PyPI Trusted Publishing cannot authenticate from a cross-repo reusable workflow (job_workflow_ref=$JOB_WORKFLOW_REF — see pypi/warehouse#11096). Upload skipped; publish via the repo's own pypi-publish.yml."
          fi

      - name: Upload to PyPI
        if: steps.pypi.outputs.exists != 'true' && steps.oidc.outputs.feasible == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          # Resumes partial releases: files already on PyPI are skipped,
          # missing ones upload — the check above only gates the
          # fully-published case.
          skip-existing: true

  docker:
    # Needs only the wheel gate: the image builds from source and the
    # version is read from pyproject below — a PyPI outage must not
    # block the container publish.
    needs: [detect, verify]
    if: always() && needs.detect.result == 'success' && inputs.docker-image != '' && needs.verify.result != 'failure' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR push
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version and image ref
        id: v
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.docker-image }}
          EXT_VERSION: ${{ needs.detect.outputs.ext-version }}
        run: |
          ver=$(python3 - <<'PY'
          import os, tomllib
          pp = os.path.join(os.environ['PACKAGE_DIR'], 'pyproject.toml')
          if os.path.exists(pp):
              print(tomllib.load(open(pp, 'rb'))['project']['version'])
          else:
              print(os.environ.get('EXT_VERSION', ''))
          PY
          )
          test -n "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # Docker refs are lowercase-only — an owner like Icaro0310
          # would otherwise produce an invalid ghcr.io/<Owner>/<img>
          # reference that buildx rejects before the push.
          echo "ref=ghcr.io/${OWNER,,}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repo-root Dockerfile by convention — a repo whose image builds
      # from a package subdir or needs a bespoke context keeps its own
      # docker-publish.yml and leaves docker-image empty here.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.ref }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.ref }}:latest

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.v.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  vscode-ext:
    # Needs only the wheel gate: the version is read from pyproject in
    # the lint step below — the extension artifact must survive a PyPI
    # outage or a pending environment approval.
    needs: [detect, verify]
    if: always() && needs.detect.result == 'success' && inputs.vscode-ext-dir != '' && needs.verify.result != 'failure' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    # environment:release — the Entra federated credential on each
    # caller repo is scoped to this exact environment name, so the
    # OIDC `sub` is `repo:<caller>:environment:release`. It also turns
    # marketplace publish into a human-gated deploy if the caller sets
    # required reviewers on `release`.
    environment: release
    permissions:
      contents: read
      id-token: write   # azure/login OIDC → Entra federated credential
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Manifest lint — cheap, fails before any npm/vsce work.
      # (a) `main` requires non-empty activationEvents (hit for real on
      #     devin-memory: missing activationEvents failed vsce package);
      # (b) engines.vscode present; (c) publisher present AND lower-case
      #     (Marketplace publisher IDs are lowercase — a case mismatch
      #     fails at publish); (d) name present; (e) every
      #     contributes.mcpServerDefinitionProviders entry needs its
      #     onMcpServerDefinitionProviders:<id> activation event;
      # (f) `version` must equal the release's pyproject version — the
      #     extension ships in lockstep, a stale package.json version
      #     would upload an outdated .vsix under a new release tag.
      - name: Lint extension manifest
        working-directory: ${{ inputs.vscode-ext-dir }}
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, tomllib
          pkg = json.load(open('package.json'))
          errs = []
          events = pkg.get('activationEvents') or []
          if pkg.get('main') and not events:
              errs.append("'main' is set but 'activationEvents' is missing or "
                          "empty — vsce package fails without it")
          if not pkg.get('engines', {}).get('vscode'):
              errs.append("'engines.vscode' is required")
          publisher = pkg.get('publisher')
          if not publisher or publisher != publisher.lower():
              errs.append("'publisher' must exist and be lower-case — "
                          "publisher IDs are lowercase, a case mismatch fails publish")
          if not pkg.get('name'):
              errs.append("'name' is required")
          providers = pkg.get('contributes', {}).get('mcpServerDefinitionProviders') or []
          expected = {f"onMcpServerDefinitionProviders:{p['id']}"
                      for p in providers if isinstance(p, dict) and p.get('id')}
          missing = sorted(expected - set(events))
          if missing:
              errs.append("'activationEvents' is missing MCP provider hooks: "
                          + ', '.join(missing))
          pyproject = os.path.join(os.environ['GITHUB_WORKSPACE'],
                                   os.environ['PACKAGE_DIR'], 'pyproject.toml')
          rel_version = (tomllib.load(open(pyproject, 'rb'))['project']['version']
                         if os.path.exists(pyproject) else None)
          if rel_version and pkg.get('version') != rel_version:
              errs.append(f"'version' {pkg.get('version')} != release version "
                          f"{rel_version} — the extension ships in lockstep; "
                          "bump package.json before tagging")
          # Tag conventions `<pkg>-vX.Y.Z` and bare `vX.Y.Z`: the tag is
          # the release-version signal — a mistagged release would mint
          # a GitHub/marketplace entry named X.Y.Z containing a different
          # extension version. Bare is tested FIRST and anchored on
          # v<digit>.<digit> — a bare SemVer prerelease may itself contain
          # '-v' (v1.2.3-v2 parses as 1.2.3-v2, not 2).
          ref_name = os.environ.get('GITHUB_REF_NAME', '')
          tag_version = None
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              if re.match(r'^v\d+\.\d+', ref_name):
                  tag_version = ref_name[1:]
              elif '-v' in ref_name:
                  tag_version = ref_name.rsplit('-v', 1)[1]
          if tag_version is not None and pkg.get('version') != tag_version:
              errs.append(f"'version' {pkg.get('version')} != tag "
                          f"{ref_name} — retag or bump package.json")
          for err in errs:
              print(f'::error::{err}')
          sys.exit(1 if errs else 0)
          PY

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install extension dependencies
        working-directory: ${{ inputs.vscode-ext-dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # Compiled extensions declare `main: ./out/…` with out/ ignored —
      # without the build the packaged vsix lacks its entrypoint.
      # --if-present keeps the step a no-op for plain-JS extensions.
      - name: Build extension
        working-directory: ${{ inputs.vscode-ext-dir }}
        run: npm run build --if-present

      - name: Package .vsix
        working-directory: ${{ inputs.vscode-ext-dir }}
        run: npx @vscode/vsce package

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: ${{ inputs.vscode-ext-dir }}/*.vsix

      # Marketplace publish via Entra workload-identity federation:
      # azure/login exchanges the job's GitHub OIDC token for an Entra
      # token using the `devin-vscode-marketplace` app registration
      # (federated credential `gh-<repo>-release`, subject
      # environment:release) — no PAT, no Azure subscription. The
      # identity's marketplace member ID was added to the publisher as
      # Contributor (members portal). Skips with a warning when the
      # caller repo does not define AZURE_CLIENT_ID/AZURE_TENANT_ID.
      - name: Azure login (federated)
        id: azure-login
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != ''
        # The Entra federated credential is provisioned per-repo and may
        # lag the repo vars — a login failure is a pending-setup state,
        # not a publish failure, so it must not take the independent
        # Open VSX leg down with it. `continue-on-error` keeps the step
        # visibly red while the job proceeds; the publish below gates on
        # `outcome` (the real result — `conclusion` would read success
        # under continue-on-error).
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # `continue-on-error` here too: a marketplace publish failure must
      # not take down the independent Open VSX leg (its `success()` gate
      # would otherwise read this step's failure). The final
      # `Marketplace publish required` gate below restores strictness for
      # callers that pass `azure-marketplace-required: true`.
      - name: Publish to VS Code Marketplace
        id: marketplace-publish
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && steps.azure-login.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ inputs.vscode-ext-dir }}
        run: npx @vscode/vsce publish --azure-credential --packagePath *.vsix --skip-duplicate

      - name: Marketplace publish deferred — Azure login failed
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && steps.azure-login.outcome != 'success'
        run: echo "::warning::azure/login failed — the Entra federated credential is likely not provisioned for this repo yet. Marketplace publish deferred; re-run this workflow after it exists (Open VSX is unaffected)."

      - name: Marketplace publish failed
        if: vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && steps.azure-login.outcome == 'success' && steps.marketplace-publish.outcome == 'failure'
        run: echo "::warning::vsce publish failed — the extension was NOT published to the VS Code Marketplace (Open VSX is unaffected; re-run after fixing)."

      - name: Marketplace publish skipped — Entra vars missing
        if: vars.AZURE_CLIENT_ID == '' || vars.AZURE_TENANT_ID == ''
        run: echo "::warning::AZURE_CLIENT_ID/AZURE_TENANT_ID not set — vsix stays as the 'vsix' artifact for manual portal upload (https://marketplace.visualstudio.com/manage)."

      # Open VSX — live since 2026-10-12: the `icaro0310` namespace's
      # contributor rights suffice to publish; the owner grant
      # (EclipseFdn/open-vsx.org#14088) only removes the unverified
      # banner and needs no republish. Secret arrives via caller
      # `secrets:` forwarding — reusable workflows only see secrets the
      # caller passes (or `inherit`).
      # Presence probe keeps the secret out of job-level env — a
      # job env would reach `npm ci` lifecycle scripts (supply-chain
      # exposure for a token only the publish step needs). The probe
      # reads it once, exports a boolean; the publish step maps it
      # again for ovsx alone.
      - name: Detect OVSX_PAT
        id: ovsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          [ -n "$OVSX_PAT" ] && echo "present=true" >> "$GITHUB_OUTPUT" \
                            || echo "present=false" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX
        if: steps.ovsx.outputs.present == 'true'
        working-directory: ${{ inputs.vscode-ext-dir }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --pat "$OVSX_PAT" --skip-duplicate --packagePath ./*.vsix

      - name: Open VSX publish skipped — OVSX_PAT not forwarded
        if: steps.ovsx.outputs.present == 'false'
        run: echo "::warning::OVSX_PAT not forwarded by the caller — Open VSX publish skipped (vsix stays as the 'vsix' artifact for manual `ovsx publish`)."

      # Strict gate for repos past the provisioning window: callers pass
      # `azure-marketplace-required: true` once the federated credential
      # is live — all seven release callers migrated to the input in the
      # same change wave (the repo-var predecessor was never adopted:
      # `gh variable get AZURE_MARKETPLACE_REQUIRED` returned unset in
      # every caller repo). With required, ANY non-success on the
      # marketplace leg fails the job AFTER the Open VSX leg — including
      # missing Entra vars (a misconfiguration must not pass silently),
      # login failure, or vsce failure. The release goes red without
      # blocking the other registry.
      - name: Marketplace publish required
        if: inputs.azure-marketplace-required == true && steps.marketplace-publish.outcome != 'success'
        run: |
          echo "::error::azure-marketplace-required=true but the marketplace leg did not publish (login outcome: ${{ steps.azure-login.outcome }}, publish outcome: ${{ steps.marketplace-publish.outcome }}). Fix the Entra federated credential / AZURE_* vars, or drop the input from the caller."
          exit 1

  gh-marketplace:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Informational only — GitHub Marketplace listing is a checkbox on
      # the release-creation form ("Publish this Action to the GitHub
      # Marketplace"), not a CI step, and editing a release afterwards
      # cannot add it. Gotchas for the release form: action description
      # <125 chars (silent blocker), branding icon+color required, and
      # the listing slug comes from action.yml `name:`, not the repo.
      - name: Note Marketplace listing path
        run: echo "::notice::GitHub Marketplace listing happens at release creation (checkbox on the release form) — nothing to do in CI."
