name: scout-notify

# Emails a maintainer-supplied scout report when manually dispatched.
# The report markdown is passed as a workflow input — reports are not stored
# in this repository (they may contain maintainer-private context).
# Configure MailerSend SMTP secrets plus REPORT_RECIPIENT and REPORT_SENDER
# repository variables; this workflow does not run the scout itself.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Report date (YYYY-MM-DD), used in the subject line"
        required: true
        type: string
      report_md:
        description: "Report markdown content to email"
        required: true
        type: string

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Write supplied report
        env:
          REPORT_MD: ${{ inputs.report_md }}
        run: printf '%s' "$REPORT_MD" > scout-report.md && test -s scout-report.md

      - name: Check email configuration
        id: mail
        env:
          SMTP_HOST: ${{ secrets.MAILERSEND_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.MAILERSEND_SMTP_PORT }}
          SMTP_USER: ${{ secrets.MAILERSEND_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.MAILERSEND_SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ vars.REPORT_RECIPIENT }}
          REPORT_SENDER: ${{ vars.REPORT_SENDER }}
        run: |
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_PORT" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$REPORT_RECIPIENT" ] && [ -n "$REPORT_SENDER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Configure SMTP secrets and REPORT_RECIPIENT/REPORT_SENDER variables to enable email."
          fi

      - name: Send scout report via MailerSend SMTP
        if: steps.mail.outputs.ready == 'true'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: ${{ secrets.MAILERSEND_SMTP_HOST }}
          server_port: ${{ secrets.MAILERSEND_SMTP_PORT }}
          username: ${{ secrets.MAILERSEND_SMTP_USER }}
          password: ${{ secrets.MAILERSEND_SMTP_PASSWORD }}
          secure: false
          subject: "Devin ecosystem — scout semanal ${{ inputs.date }}"
          to: ${{ vars.REPORT_RECIPIENT }}
          from: ${{ vars.REPORT_SENDER }}
          body: file://scout-report.md
          attachments: scout-report.md
