name: ci

# Self-scan: the hub's own workflows (incl. the reusable pypi-publish.yml)
# are only checked when some OTHER repo's ci calls secrets-scan — nothing
# scanned this checkout itself. Local workflow_call fixes that: the same
# reusable, run against the hub's own tree on every push/PR.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    uses: ./.github/workflows/secrets-scan.yml
