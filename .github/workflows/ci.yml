name: ci

# Self-scan: the hub's own workflows (incl. the reusable pypi-publish.yml)
# are only checked when some OTHER repo's ci calls secrets-scan — nothing
# scanned this checkout itself. Local workflow_call fixes that: the same
# reusable, run against the hub's own tree on every push/PR. Same for
# adapters-check — the hub ships adapters/ + .devin/skills/ like any
# other repo.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    uses: ./.github/workflows/secrets-scan.yml
  adapters-check:
    uses: ./.github/workflows/adapters-check.yml
  config-restricted-check:
    uses: ./.github/workflows/config-restricted-check.yml

  # Dev-dep pin sensor: fails when a lint/test/build tool floats (bare
  # >=, uvx/pipx/pip install without a spec, ruff-action without a
  # version: input). Scans this checkout + template/ — the template is
  # the declaration site every generated repo inherits. Per-repo
  # rollout (callers' ruff>=x / ruff-action floats) is a follow-up; the
  # check can ride python-test.yml or its own reusable when it does.
  dev-deps-pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Dev-tool pins (repo + template)
        run: |
          python3 tools/dev-deps-pin-check.py .
          python3 tools/dev-deps-pin-check.py template
          python3 tools/dev-deps-pin-check.py --selftest
