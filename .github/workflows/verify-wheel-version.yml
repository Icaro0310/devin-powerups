name: verify-wheel-version (reusable)

# Single home for the "the wheel self-reports pyproject version" gate.
# Publish workflows call this instead of carrying a copied inline step —
# a package cannot reach PyPI without passing it, and a copy that drifts
# or is skipped entirely becomes impossible rather than unnoticed.

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory containing pyproject.toml
        type: string
        required: true
      module:
        description: Importable module name that must expose __version__
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        working-directory: ${{ inputs.package-dir }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Assert wheel __version__ matches pyproject
        working-directory: ${{ inputs.package-dir }}
        env:
          PKG: ${{ inputs.module }}
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test -n "$ver"
          # --no-deps is deliberate: the gate only verifies the wheel's
          # __version__ metadata, and staying off the index keeps the check
          # valid even when a sibling dependency release is not published yet.
          pip install --no-cache-dir --no-deps --target /tmp/verchk dist/*.whl
          VER="$ver" python -c "import importlib, os, sys; sys.path.insert(0, '/tmp/verchk'); m = importlib.import_module('$PKG'); assert getattr(m, '__version__', None) == os.environ['VER'], f'wheel __version__ {getattr(m, \"__version__\", None)} != pyproject {os.environ[\"VER\"]}'"
