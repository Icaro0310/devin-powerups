name: verify-wheel-version (reusable)

# Single home for the "the wheel self-reports pyproject version" gate.
# Publish workflows call this instead of carrying a copied inline step —
# the verified dist/ is uploaded as the `dist` artifact so the publish
# job ships the exact bits that passed the gate, and a copy that drifts
# or is skipped entirely becomes impossible rather than unnoticed.

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory containing pyproject.toml
        type: string
        required: true
      module:
        description: >-
          Importable module name that must expose __version__. Optional:
          when empty it is read from the built wheel's top_level.txt
          (falling back to pyproject project.name with '-' normalized to
          '_'). Pass explicitly only when neither matches the module.
        type: string
        required: false
        default: ""
      python-version:
        description: Interpreter used to build and install the wheel —
          must satisfy the package's Requires-Python
        type: string
        default: "3.11"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac

      - name: Build sdist and wheel
        working-directory: ${{ inputs.package-dir }}
        # Pinned, not --upgrade-latest: the publish path must not float
        # build/twine across runs (dev-deps-pin-check enforces).
        run: |
          python -m pip install --upgrade "build==1.2.2" "twine==7.0.0"
          python -m build
          python -m twine check dist/*

      - name: Assert wheel __version__ matches pyproject
        working-directory: ${{ inputs.package-dir }}
        env:
          PKG: ${{ inputs.module }}
        run: |
          # tomllib parses real TOML (single quotes, indentation, repeated
          # tables) instead of a line-oriented sed match.
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test -n "$ver"
          # --no-deps is deliberate: the gate only verifies the wheel's
          # __version__ metadata, and staying off the index keeps the check
          # valid even when a sibling dependency release is not published yet.
          pip install --no-cache-dir --no-deps --target /tmp/verchk dist/*.whl
          # `module` optional: prefer the wheel's own top_level.txt (what
          # was actually built), else the ecosystem convention project.name
          # with '-' normalized to '_'. A wrong pick fails the import
          # loudly — a non-matching package is blocked, not passed.
          if [ -z "$PKG" ]; then
            # find, not ls|head: a wheel can omit top_level.txt, and under
            # pipefail a failed ls kills the step before the fallback runs.
            tl=$(find /tmp/verchk -maxdepth 2 -path '/tmp/verchk/*.dist-info/top_level.txt' -print -quit 2>/dev/null || true)
            if [ -n "$tl" ]; then
              PKG=$(head -1 "$tl" | tr -d '[:space:]')
            else
              PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'].replace('-','_'))")
            fi
          fi
          # PKG stays an env value read by Python — interpolating it into
          # the script would reopen the shell-injection class.
          VER="$ver" PKG="$PKG" python - <<'PY'
          import importlib, os, sys
          sys.path.insert(0, '/tmp/verchk')
          m = importlib.import_module(os.environ['PKG'])
          assert getattr(m, '__version__', None) == os.environ['VER'], (
              f"wheel __version__ {getattr(m, '__version__', None)}"
              f" != pyproject {os.environ['VER']}")
          PY

      # Upload only after the assert: the artifact is the exact dist/ that
      # passed the gate, so a publish job downloading `dist` can never ship
      # an unverified build.
      - name: Upload verified dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: ${{ inputs.package-dir }}/dist/
