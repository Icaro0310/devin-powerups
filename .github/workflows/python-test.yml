name: python-test (reusable)

# Pin policy (D-2026-10-13i): callers reference this workflow via the
# floating `@v1` tag ON PURPOSE — it runs with `contents: read` only, so
# tag moves propagate fixes (version lockstep, uv lock --check) to all
# callers with zero rollout. Elevated-permission publish-path workflows
# (verify-wheel-version, pypi-publish) are SHA-pinned instead, and pay
# the per-repo pin-bump rollout. Do not "fix" @v1 to a SHA here by
# analogy — that buys a 15-repo rollout for a gain this job doesn't need.

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      package-dir:
        type: string
        default: "."
      pre-install:
        description: >-
          Extra pip install args run before the package install
          (e.g. "-e shared/install-scheduler" for workspace deps not yet on PyPI).
          Contract: space-separated args, no quoting — paths with spaces are unsupported
        type: string
        default: ""
      skip-install:
        description: Skip `pip install -e package-dir[dev]` — for test dirs
          that are not themselves installable packages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Version lockstep (pyproject vs __version__)
        if: ${{ !inputs.skip-install }}
        working-directory: ${{ inputs.package-dir }}
        shell: bash
        # PR-time twin of the publish gate: drift between pyproject
        # [project].version and the package's __version__ must fail here,
        # not at release (verify-wheel-version). Resolved strictly by
        # project.name — a workspace-root or shim pyproject without the
        # module dir is skipped, never falsely flagged.
        run: |
          [ -f pyproject.toml ] || exit 0
          python - <<'PY'
          import pathlib, re, sys, tomllib
          meta = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          ver, mod = meta["version"], meta["name"].replace("-", "_")
          # Candidate __init__.py files: the module derived from
          # project.name (src/ and flat layouts) plus every direct module
          # dir under this package's own src/. Name normalization misses
          # dist-name != module-name cases (devin-internals-spec ships
          # devin_internals; devin-judge ships poordjaevin). One level
          # deep only: rglob would descend into monorepo siblings and
          # flag a workspace-root pyproject against a package's version.
          cands = sorted(pathlib.Path("src").glob("*/__init__.py"))
          cands += [pathlib.Path(mod) / "__init__.py"]
          init = next((p for p in cands
                       if p.is_file() and "__version__" in p.read_text()), None)
          if init is None:
              print(f"::notice::{meta['name']}: no module __init__ with __version__ "
                    "under package-dir — lockstep skipped")
              sys.exit(0)
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)', init.read_text())
          if m.group(1) != ver:
              print(f"::error::{init}: __version__ {m.group(1)} != pyproject {ver} "
                    "— the publish gate would reject this wheel; sync before merge")
              sys.exit(1)
          print(f"version lockstep ok: {ver}")
          PY

      - name: Plugin manifest lockstep (plugin.json vs pyproject)
        if: ${{ !inputs.skip-install }}
        working-directory: ${{ inputs.package-dir }}
        shell: bash
        # Same drift family as __version__: package bumps never touch
        # adapters/.devin-plugin/plugin.json — every drifted package was
        # one that had been bumped (all aligned ones sat at never-bumped
        # 0.1.0). Skips cleanly when no plugin manifest ships.
        run: |
          [ -f pyproject.toml ] || exit 0
          python - <<'PY'
          import json, pathlib, sys, tomllib
          plug = pathlib.Path("adapters/.devin-plugin/plugin.json")
          if not plug.is_file():
              print("::notice::no plugin manifest — plugin lockstep skipped")
              sys.exit(0)
          ver = tomllib.loads(pathlib.Path("pyproject.toml")
                              .read_text())["project"]["version"]
          pver = json.loads(plug.read_text())["version"]
          if pver != ver:
              print(f"::error::{plug}: version {pver} != pyproject {ver} "
                    "— keep the manifest in lockstep with the package")
              sys.exit(1)
          print(f"plugin lockstep ok: {ver}")
          PY

      - name: Lockfile freshness (uv.lock vs pins)
        shell: bash
        # uv.lock lives at the repo/workspace root, not in package-dir.
        # CI installs via pip and never reads the lock — without this
        # step a pin bump can drift from the lock silently (seen:
        # devin-explore internals-spec >=0.3.1 pin vs 0.3.0 lock).
        # Repos that don't track uv.lock skip cleanly (e.g. devin-brain).
        run: |
          [ -f uv.lock ] || { echo "::notice::no uv.lock — skipped"; exit 0; }
          pipx run uv lock --check

      - name: Pre-install workspace deps
        if: inputs.pre-install != ''
        shell: bash
        env:
          # caller-provided input must not reach the shell via inline
          # interpolation — env values are never re-parsed
          PRE_INSTALL: ${{ inputs.pre-install }}
        # unquoted: the input is a space-separated args string — word
        # splitting is intended, quote chars pass through literally
        run: pip install $PRE_INSTALL

      - name: Install
        if: ${{ !inputs.skip-install }}
        shell: bash
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
        run: pip install -e "${PACKAGE_DIR}[dev]"

      - name: Test
        run: pytest -q
        working-directory: ${{ inputs.package-dir }}
