name: python-test (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      package-dir:
        type: string
        default: "."
      pre-install:
        description: Extra pip install args run before the package install
          (e.g. "-e shared/install-scheduler" for workspace deps not yet on PyPI)
        type: string
        default: ""
      skip-install:
        description: Skip `pip install -e package-dir[dev]` — for test dirs
          that are not themselves installable packages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Pre-install workspace deps
        if: inputs.pre-install != ''
        run: pip install ${{ inputs.pre-install }}

      - name: Install
        if: ${{ !inputs.skip-install }}
        run: pip install -e "${{ inputs.package-dir }}[dev]"

      - name: Test
        run: pytest -q
        working-directory: ${{ inputs.package-dir }}
