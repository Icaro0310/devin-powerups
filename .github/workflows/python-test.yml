name: python-test (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      package-dir:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install
        run: pip install -e "${{ inputs.package-dir }}[dev]"

      - name: Test
        run: pytest -q
        working-directory: ${{ inputs.package-dir }}
