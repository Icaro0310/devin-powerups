name: adapters-check (reusable)

# Reusable only: repo ci.yml callers invoke this with `uses:` (see
# .github/workflows/VARIANTS.md). Scans the caller's distributed adapter
# files (adapters/, packages/*/adapters/, .devin/skills/) for the failure
# class secrets-scan does not cover: personal paths, internal endpoints
# and project names, token-shaped values, and SKILL.md CLI invocations
# that the owning package does not ship (docs/adapter-checklist.md).
# Known-legitimate hits are pinned per file via a repo-root
# `.adapters-hygiene-allow` (one `path sha256=<hex>` line each) — the same
# mechanism as .secrets-scan-allow: no blanket directory exclusions, and
# a hash pin means editing an allowlisted file re-triggers the scan.
#
# The scanner ships in this repo (scripts/check-adapters-hygiene.py) and
# is fetched from the same `v1` tag the caller pinned — script and
# workflow versions move together on retag (D-2026-10-13i). A repo that
# carries its own copy of the script (this one, on a PR that edits it)
# runs that copy instead, so scanner changes are exercised by the PR
# that introduces them.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  adapters-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch the scanner when the repo does not ship it
        if: hashFiles('scripts/check-adapters-hygiene.py') == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Icaro0310/devin-powerups
          ref: v1
          path: .powerups-sensor
          persist-credentials: false

      - name: Scan distributed adapter files
        run: |
          set -e
          SCRIPT=scripts/check-adapters-hygiene.py
          [ -f "$SCRIPT" ] || SCRIPT=".powerups-sensor/$SCRIPT"
          python3 "$SCRIPT" --root .
          python3 "$SCRIPT" --selftest
