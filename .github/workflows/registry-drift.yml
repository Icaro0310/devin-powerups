name: registry-drift

# Enforces that generated documentation stays in sync with registry.json:
# platform guides (README.linux/windows/corporate-windows), the profile
# catalog block and the DevKit compatibility matrix. Fails loudly when a
# repo's docs drift from what the registry renders.

on:
  push:
    branches: [main]
    paths:
      - registry.json
      - registry.schema.json
      - tools/**
  schedule:
    - cron: "41 5 * * 0"   # Sundays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: workspace/devin-ecosystem/devin-powerups

      - name: Clone public registry repos into the expected layout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path("workspace/devin-ecosystem")
          reg = json.loads((root / "devin-powerups/registry.json").read_text())
          for entry in reg["repositories"]:
              if entry.get("visibility") != "public":
                  continue
              name = entry["name"]
              local_dir = entry.get("local_dir") or name
              target = (root / local_dir).resolve()
              if target.is_dir():
                  continue
              url = entry.get("url", f"https://github.com/Icaro0310/{name}")
              subprocess.run(["git", "clone", "--depth", "1", url, str(target)], check=True)
          PY
          git clone --depth 1 https://github.com/Icaro0310/Icaro0310 workspace/Icaro0310
          git clone --depth 1 https://github.com/Icaro0310/Icaro0310.github.io workspace/site

      - name: Validate registry schema
        working-directory: workspace/devin-ecosystem/devin-powerups
        run: python3 tools/validate_registry.py

      - name: Platform guides match the registry
        working-directory: workspace/devin-ecosystem/devin-powerups
        run: python3 tools/migrate_platform_docs.py --check --root "$(pwd)/.."

      - name: Profile catalog matches the registry
        working-directory: workspace/devin-ecosystem/devin-powerups
        run: python3 tools/render_catalog.py --check "$(pwd)/../../Icaro0310/README.md"

      - name: DevKit compatibility matrix matches the registry
        working-directory: workspace/devin-ecosystem/devin-powerups
        run: python3 tools/render_compatibility.py --check "$(pwd)/../devin-devkit/COMPATIBILITY.md"

      - name: Distribution banners match the registry
        working-directory: workspace/devin-ecosystem/devin-powerups
        run: python3 tools/check_dist_status.py --root "$(pwd)/.."

      - name: internals-spec pins allow the latest PyPI release
        working-directory: workspace/devin-ecosystem/devin-powerups
        run: python3 tools/check_spec_pins.py --root "$(pwd)/.."

      - name: Site links every public registry repo
        working-directory: workspace/devin-ecosystem/devin-powerups
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          reg = json.loads(Path("registry.json").read_text())
          site = Path("../../site/index.html").read_text()
          missing = [
              e["name"] for e in reg["repositories"]
              if e.get("visibility") == "public"
              and f"github.com/Icaro0310/{e['name']}" not in site
          ]
          if missing:
              sys.exit(f"error: site does not link: {missing}")
          print("ok: site links every public registry repo")
          PY

      - name: Site llms.txt blocks match the registry
        working-directory: workspace/devin-ecosystem/devin-powerups
        run: |
          python3 tools/render_llms.py index --check "$(pwd)/../../site/llms.txt"
          python3 tools/render_llms.py full --check "$(pwd)/../../site/llms-full.txt"
