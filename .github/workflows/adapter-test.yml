name: adapter-test (reusable)

# One adapter face, tested in isolation on both OSes. The caller points
# adapter-dir at a face's directory and test-command at that face's own
# suite — "python -m pytest -q" for the Python faces, "node --test" for
# the VS Code face. The parent package is pip-installed first so the CLI
# the adapter shells out to exists on PATH; faces that need no install
# (e.g. pure-Node) pass skip-install.
#
# Contract: docs/adapter-checklist.md — the face stays a thin shell and
# ships only this suite. Beyond the face's own test the workflow asserts
# exactly one package-level invariant: when the face has a package.json
# and the package a pyproject.toml (the VS Code face), their versions
# must match — the adapter ships in lockstep. All other faces are
# unaffected (the check no-ops when either file is absent).
#
# Trust boundary: test-command / pre-install are allowlist-guarded
# (plain charset, no shell metacharacters) before they reach a shell, so
# word splitting can never produce operators, substitution or extra
# commands — at most an executable name plus args, the same trust the
# caller already has in its own `run:` steps.

on:
  workflow_call:
    inputs:
      package-dir:
        description: Path to the product package the adapter shells out to
        type: string
        default: "."
      adapter-dir:
        description: Face directory — test-command's working-directory
        type: string
        required: true
      test-command:
        description: >-
          The face's own test command, run inside adapter-dir —
          e.g. "python -m pytest -q" or "node --test".
          Contract: single command, space-separated args — must match
          ^[a-zA-Z0-9 ./_-]+$ (enforced fail-closed by the guard step;
          wrap anything more in a pytest.ini / package.json script).
        type: string
        required: true
      python-version:
        description: Python toolchain version; "" skips setup-python
        type: string
        default: "3.11"
      node-version:
        description: >-
          Node toolchain version; "" (default) skips setup-node — set it
          for the VS Code face and other Node faces
        type: string
        default: ""
      pre-install:
        description: >-
          Extra pip install args run before the package install
          (e.g. "-e shared/install-scheduler" for workspace deps not yet
          on PyPI). Contract: space-separated args matching
          ^[a-zA-Z0-9 ./_-]+$ — same guard as test-command; paths with
          spaces are unsupported
        type: string
        default: ""
      skip-install:
        description: >-
          Skip `pip install -e package-dir[dev]` — for faces whose CLI is
          already on PATH or that ship no installable parent
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Guard caller-controlled inputs
        # Runs first — before checkout — so a rejected value fails the
        # job before anything else executes.
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          PRE_INSTALL: ${{ inputs.pre-install }}
        # Fail-closed allowlist: every character that gives the shell
        # special meaning is rejected — ; && | $ ` > < ' " \ * ? [ ] ~ !
        # # : , = % ^ { } ( ) and newlines. What remains can word-split
        # into at most an executable plus literal args; it cannot
        # select operators, substitutions, globs or extra commands.
        # The pattern lives in a variable — a literal space inside an
        # unquoted [[ =~ ]] RHS is a bash syntax error.
        run: |
          allow='^[a-zA-Z0-9 ./_-]+$'
          for value in "$TEST_COMMAND" "$PRE_INSTALL"; do
            [ -z "$value" ] && continue
            if [[ ! "$value" =~ $allow ]]; then
              echo "::error::caller input must match $allow (plain command + args, no shell metacharacters); rejected: $value"
              exit 1
            fi
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Assert adapter/package version lockstep
        # Catches at PR time what the release lint would catch at tag
        # time — three drift incidents in three weeks (redact, evals,
        # memory/search) say release-time-only is too late. Fires only
        # when the face has a package.json AND the package has a
        # pyproject — the VS Code face today; a no-op for every other
        # face. The extension ships in lockstep with its package.
        shell: bash
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
          ADAPTER_DIR: ${{ inputs.adapter-dir }}
        # Runs before setup-python/setup-node — only runner-image tools
        # (node + sed exist on all three images). JSON is parsed, not
        # grepped, so nested "version" keys can't shadow the top-level
        # one; the TOML read is confined to the [project] table and
        # accepts both quote styles.
        run: |
          ext="$ADAPTER_DIR/package.json"; pkg="$PACKAGE_DIR/pyproject.toml"
          { [ -f "$ext" ] && [ -f "$pkg" ]; } || exit 0
          ext_v=$(node -p "JSON.parse(require('fs').readFileSync('$ext','utf8')).version || ''")
          pkg_v=$(sed -n '/^\[project\]/,/^\[/p' "$pkg" \
                  | sed -nE "s/^version[[:space:]]*=[[:space:]]*[\"']([^\"']+)[\"'].*/\1/p" | head -1)
          if [ -z "$ext_v" ] || [ -z "$pkg_v" ]; then
            echo "::error::cannot read a static version from $ext or $pkg — the lockstep gate requires static versions in both"
            exit 1
          fi
          if [ "$ext_v" != "$pkg_v" ]; then
            echo "::error::$ext version $ext_v != $pkg version $pkg_v — the adapter ships in lockstep; bump both"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.node-version != ''
        with:
          node-version: ${{ inputs.node-version }}

      - name: Pre-install workspace deps
        if: inputs.pre-install != ''
        shell: bash
        env:
          # caller-provided input must not reach the shell via inline
          # interpolation — env values are never re-parsed
          PRE_INSTALL: ${{ inputs.pre-install }}
        # unquoted: space-separated args — word splitting is intended;
        # the guard step above already proved the charset contains no
        # shell metacharacters, so splitting is all the shell can do
        run: pip install $PRE_INSTALL

      - name: Install parent package
        if: ${{ !inputs.skip-install && inputs.python-version != '' }}
        shell: bash
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
        run: pip install -e "${PACKAGE_DIR}[dev]"

      - name: Test adapter face
        working-directory: ${{ inputs.adapter-dir }}
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        # unquoted: space-separated args — word splitting is intended;
        # the guard step above already proved the charset contains no
        # shell metacharacters, so splitting is all the shell can do.
        # The env indirection also keeps the input out of inline ${{}}
        # interpolation.
        run: $TEST_COMMAND
